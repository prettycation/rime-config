# @format

custom_phrase:
  dictionary: ""
  user_dict: user_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 99

grammar:
  language: wanxiang-lts-zh-hans
  collocation_max_length: 8
  collocation_min_length: 3
  collocation_penalty: -10
  non_collocation_penalty: -17
  rear_penalty: -18
  weak_collocation_penalty: -24

user_predict:
  enable_post_predict: true # 引擎 A：是否开启上屏后的联想预测
  enable_context_reorder: true # 引擎 B：是否开启输入过程中的实时上下文调频
  max_candidates: 5 # 候选栏中最多显示的联想词数量
  max_predictions: 3 # 级联深度：允许连续自动预测的最大跳数
  expiry_days: 90 # 物理生命周期：超 90 天未使用的 1/2-Gram 将被销毁
  activation_days: 7 # 激活锁：新词若 7 天内不再使用，将被视为噪音冷冻
  decay_rate: 0.85 # 遗忘衰减率：数值越小，旧词权重掉得越快
  context_timeout: 5000 # 语境熔断 (ms)：停顿超 5 秒自动切断上下文，防远距离穿透
  enable_predict_space: false # 键盘双模式 AB 面开关
  db_name: "lua/predict"
# 模式 B (默认 false，沉浸预测流)：Space 空格键交由 Rime 原生系统顺滑选词；按下 Tab、→、\ 或 Alt 等替身键时，打断联想并强制输出物理空格。

# 模式 A (true，精准空格流)：Space 强制打断联想并输出物理空格；替身键仅作纯粹的打断清空。

super_comment:
  candidate_length: 16 # 注释候选长度
  corrector_type: "comment" # 随意更换左右括号，比如"〔comment〕" 不加括号为无括号，comment占位不能动
  chaifen: "chaifen" # 拆分显示，随意更换左右括号，比如"〔chaifen〕" 不加括号为无括号，chaifen占位不能动
  cand_type:
    user_phrase: "⁺" # 用户自造词
    sentence: "∞" # 整句
    table: "✬" # mix词库里的词
    user_table": "⌥" # 自定义短语
    typo: "⇄" # 纠错
    user_table: "⌥" # 自定义短语
    completion: "☯" # 长词联想
    abbrev: "ϟ" # 简码
    predict: "⋙" # 预测候选
    pinned: "📌" # pin 候选
    # phrase: ""                  # cn词库里的词

super_processor:
  enable_backspace_limit: true
  enable_seg_loop: true
  enable_tone_fallback: true
  enable_predict_space: false
  kp_number_mode: auto
  limit_repeated: "16,64"
  select_character: "bracketleft, bracketright"

wanxiang_english:
  dictionary: wanxiang_english
  user_dict: user_en
  enable_completion: true
  initial_quality: 2.1
  comment_format:
    - xform/^~.+$//
  english_spacing: off
  spacing_timeout: 5
  max_candidates: 0
  min_word_length: 3 # 最少三个字母才会查字典，防止巨量候选
  trigger: "\\"

switches:
  - name: ascii_mode
    states: [, ]
    reset: 0
  - name: ascii_punct
    states: [, ]
    reset: 0
  - name: full_shape
    states: [, ]
    reset: 0
  - name: emoji
    states: [, ]
    reset: 0
  - name: kaomoji
    states: [颜文关, 颜文开]
    reset: 0
  - name: super_tips
    states: [提示关, 提示开]
    reset: 1
  - name: prediction
    states: [预测关, 预测开]
    reset: 1
  - name: chinese_english
    states: [翻译关, 翻译开]
    reset: 0
  - options: [raw_input, tone_display, full_pinyin]
    states: [原编码, 有声调, 无声调]
    reset: 1
  - options: [comment_off, aux_hint, tone_hint]
    states: [注释关, 辅助开, 读音开]
    reset: 1
  - options: [s2s, s2t, s2hk, s2tw]
    states: [简体, 通繁, 港繁, 臺繁]
    reset: 0

key_binder:
  import_preset: default
  datetime_keys: "/"
  bindings:
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
    - { when: always, toggle: ascii_punct, accept: Control+Shift+3 }
    - { when: always, toggle: ascii_punct, accept: Control+Shift+numbersign }
    - { when: composing, accept: Alt+Left, send: Shift+Left }
    - { when: composing, accept: Alt+Right, send: Shift+Right }
    - { when: composing, accept: Control+w, send: Control+BackSpace }
    - { when: has_menu, accept: "Control+e", toggle: chinese_english }
    - { when: has_menu, accept: "Tab", send: "Control+Right" }
    - { when: composing, accept: "Tab", send: "Control+Right" }
    - {
        when: composing,
        accept: "Control+Tab",
        send_sequence: "{Home}{Shift+Right}{1}{Shift+Right}",
      }

editor:
  bindings:
    space: confirm
    Return: commit_raw_input
    Control+Return: commit_script_text
    Control+Shift+Return: commit_comment
    BackSpace: revert
    Delete: delete
    Control+BackSpace: back_syllable
    Control+Delete: delete_candidate
    Escape: cancel

navigator:
  bindings:
    Left: left_by_char_no_loop
    Right: right_by_char_no_loop
    Shift+Left: left_by_syllable
    Shift+Right: right_by_syllable
